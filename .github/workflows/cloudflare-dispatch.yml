name: Monitor Zelda disparado por Cloudflare

run-name: 🤖 Cloudflare → GitHub · ${{ github.event.client_payload.scheduled_time || 'manual' }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-dispatch.yml'
      - 'cloudflare/run-monitor.mjs'
      - 'cloudflare/src/monitor-core.js'
  repository_dispatch:
    types: [cloudflare_tick]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: switch2-zelda-cloudflare-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar monitor completo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SCHEDULED_TIME: ${{ github.event.client_payload.scheduled_time || '' }}
        run: node cloudflare/run-monitor.mjs
