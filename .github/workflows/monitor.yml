name: Revisar stock Switch 2 Zelda 40th

on:
  push:
    branches: [main]
    paths-ignore:
      - 'state/**'
  schedule:
    # Tiendas conocidas: cada 5 minutos (mínimo admitido por GitHub Actions).
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
    # Descubrir tiendas/publicaciones nuevas: cada 15 minutos.
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      discover:
        description: 'Buscar también publicaciones nuevas'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: switch2-zelda-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar tiendas
        id: check
        shell: bash
        run: |
          set -euo pipefail
          DISCOVER=''
          if [[ "${{ github.event.schedule }}" == "4,19,34,49 * * * *" || "${{ github.event_name }}" == "push" ]]; then
            DISCOVER='--discover'
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.discover }}" == "true" ]]; then
            DISCOVER='--discover'
          fi
          python monitor.py --state state/state.json --report report.md $DISCOVER

      - name: Guardar nuevo estado
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- state/state.json; then
            echo 'Estado sin cambios.'
            exit 0
          fi
          git config user.name 'switch-stock-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/state.json
          git commit -m 'chore: actualizar estado del monitor [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Avisar mediante GitHub Issue
        if: steps.check.outputs.changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COUNT='${{ steps.check.outputs.count }}'
          TITLE="🚨 Switch 2 Zelda 40th: ${COUNT} cambio(s) detectado(s)"
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --body-file report.md \
            --assignee "$GITHUB_REPOSITORY_OWNER" \
          || gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --body-file report.md
